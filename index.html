<style>

*{box-sizing:border-box;margin:0}

.pb{font:inherit;font-size:12px;background:#fff;border:4px solid #111;box-shadow:4px 4px 0 #111;padding:12px 14px;cursor:pointer;color:#111}
.pb:hover,.pb.on{background:#111;color:#fff}

#mm{min-height:30px;font-size:9px;line-height:1.7;text-align:center;background:#fff}

#setup h2{font-size:14px;text-align:center;font-weight:400}
input{font:inherit;font-size:12px;border:4px solid #111;padding:10px;width:100%}

.gv{text-align:left;font-size:9px;line-height:1.7;padding:10px;box-shadow:3px 3px 0 #111}

#game{position:absolute;inset:0;display:flex;flex-direction:column;background:#1b1f2b}
#hd{padding:6px 8px;background:#fff;border-bottom:4px solid #111;font-size:9px;line-height:1.7}
#wrap{flex:1;display:flex;position:relative;min-height:0;overflow:auto}
#map{margin:auto;image-rendering:pixelated;cursor:crosshair;touch-action:manipulation}

#lb i{display:inline-block;width:8px;height:8px;margin-right:4px}

.row{border-bottom:2px dashed #999;padding:6px 0}
.tree{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tree .pb{text-align:left;line-height:1.6;margin:0;width:100%}
.tree .pb.own{background:#2a9d8f;color:#fff}.tree .pb.lk{opacity:.4}
#toast{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 10px;font-size:9px;text-align:center;max-width:92%;z-index:9}
#end{background:#fffe;z-index:20;text-align:center;gap:20px;line-height:1.8;font-size:14px}
#bye{background:#111;color:#fff;gap:20px;z-index:30;font-size:14px;text-align:center;line-height:1.8}
</style>

<div id="menu" class="scr"><canvas id="bg"></canvas><div class="mc"><h1>Wordi</h1>

<div id="lobby" class="scr" hidden><div class="mc" style="width:min(560px,94vw)"><h2 id="lt" style="font-size:14px;text-align:center;font-weight:400"></h2><div id="lc" style="font-size:32px;text-align:center;letter-spacing:4px"></div><div id="ll" style="font-size:10px;line-height:2.2"></div><button class="pb" id="ls">Iniciar partida</button><button class="pb" id="lq">Sair</button></div></div>
<div id="game" hidden><div id="hd"></div><div id="wrap"><canvas id="map"></canvas><div id="lb"></div><div id="pan" hidden></div><div id="toast" hidden></div></div><div id="bar"></div></div>

<script>
const $=s=>document.querySelector(s),W=400,H=224,N=W*H,rnd=n=>Math.random()*n|0;
const COLS=['#e63946','#2a9d8f','#f4a261','#6a4c93','#2b7de9','#e9c46a','#8ac926','#ff5fa2'];

const PAL={k:'#1b1b1b',w:'#f5f5f5',r:'#d62828',y:'#f2c230',b:'#8a5a2b',B:'#3b7dd8',G:'#4caf50',s:'#a8a8a8',d:'#5f5f5f'};
const SPR={city:['...kk...','..krrk..','.krrrrk.','kkkkkkkk','kwwkywwk','kwwkywwk','kwwkbbwk','kkkkkkkk'],wall:['k.k.k.k.','ksksksks','ksssssdk','kssdsssk','ksssssdk','kdsssdsk','kkkkkkkk','........'],farm:['..kkkk..','.krrrrk.','krrwwrrk','krrwwrrk','kkkkkkkk','yGyGyGyG','GyGyGyGy','yGyGyGyG'],bar:['...kr...','...krr..','...k....','.kkkkkk.','.kddddk.','.kdssdk.','.kdskdk.','.kkkkkk.'],mine:['...kk...','..kssk..','.kssssk.','kssddssk','ksdkkdsk','ksdkkdsk','kyskksyk','kkkkkkkk'],port:['....k...','...kwk..','..kwwwk.','.kwwwwwk','....k...','.kbbbbbk','kBkbkbkB','BBBBBBBB']};

BK.forEach(k=>IC[k]=spr(k,2).toDataURL());
const SK=[['agr1','Agricultura I',80,'','g',.25,'+25% crescimento'],['agr2','Agricultura II',200,'agr1','g',.35,'+35% crescimento'],['com1','Comércio I',80,'','e',.25,'+25% ouro'],['com2','Comércio II',200,'com1','e',.35,'+35% ouro'],['tat1','Táticas I',100,'','a',.15,'-15% custo de ataque'],['tat2','Táticas II',250,'tat1','a',.2,'-20% custo de ataque'],['for1','Fortificação I',100,'','d',.25,'+25% defesa'],['for2','Fortificação II',250,'for1','d',.35,'+35% defesa']];
const NB=[...Array(N)].map((_,i)=>{const x=i%W,r=[];if(x>0)r.push(i-1);if(x<W-1)r.push(i+1);if(i>=W)r.push(i-W);if(i<N-W)r.push(i+W);return r});
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
let NET=null,TOASTCONN=null,COMP,BO=[],P,own,land,bld,A,S=4,hum,paused,sel=.5,tool=0,T=0,panel='',landN=1,md='sp',selC=COLS[0],selG='dem',run=0,tt;
const off=document.createElement('canvas');off.width=W;off.height=H;const o2=off.getContext('2d'),cv=$('#map'),cx=cv.getContext('2d');
/* ---------- telas ---------- */
let menuOn=1,raf=0;
function show(id){document.querySelectorAll('.scr').forEach(s=>s.hidden=s.id!=id);$('#game').hidden=id!='game';if(id=='end'){$('#game').hidden=false;$('#end').hidden=false}menuOn=id=='menu';if(menuOn&&!raf)loop()}
const bg=$('#bg'),bx=bg.getContext('2d');let cubes=[];
function cube(x,y,s){const d=s/3|0;bx.fillStyle='#dcdcdc';for(let i=1;i<=d;i++)bx.fillRect(x+i,y-i,s,1);bx.fillStyle='#8f8f8f';for(let i=1;i<=d;i++)bx.fillRect(x+s+i-1,y-i,1,s);bx.fillStyle='#b4b4b4';bx.fillRect(x,y,s,s)}
function loop(){raf=0;if(!menuOn)return;const w=bg.width=Math.ceil(innerWidth/4),h=bg.height=Math.ceil(innerHeight/4);
 if(!cubes.length)for(let i=0;i<16;i++)cubes.push({x:rnd(w),y:rnd(h),s:6+rnd(14),v:.03+Math.random()*.08});
 bx.fillStyle='#fff';bx.fillRect(0,0,w,h);for(const c of cubes){c.y-=c.v;if(c.y<-c.s*2)c.y=h+c.s;cube(c.x%w|0,c.y|0,c.s)}raf=requestAnimationFrame(loop)}
function msg(t){$('#mm').textContent=t}
$('#sp').onclick=()=>setup('sp');$('#mp').onclick=()=>setup('mp');
$('#iv').onclick=()=>msg('Para jogar com amigos: Multiplayer > Criar sala, e mande o código.');
$('#qt').onclick=()=>{try{close()}catch(e){}show('bye')};$('#bb').onclick=()=>show('menu');
$('#bk').onclick=()=>{netClose();show('menu')};$('#eb').onclick=()=>{run=0;netClose();show('menu')};
function setup(m){md=m;$('#st').textContent=m=='sp'?'Singleplayer · 5 bots':'Multiplayer online · crie uma sala ou entre com um código';$('#mpbox').hidden=m=='sp';$('#go').textContent=m=='sp'?'Jogar':'Criar sala';smsg('');show('setup')}
$('#cols').innerHTML=COLS.map(c=>`<div class="sw" data-c="${c}" style="background:${c}"></div>`).join('');
$('#govs').innerHTML=Object.keys(GOV).map(k=>`<button class="pb gv" data-g="${k}"><b>${GOV[k][0]}</b>${GOV[k][1]}</button>`).join('');
function sync(){document.querySelectorAll('.sw').forEach(e=>e.classList.toggle('on',e.dataset.c==selC));document.querySelectorAll('.gv').forEach(e=>e.classList.toggle('on',e.dataset.g==selG))}
$('#cols').onclick=e=>{if(e.target.dataset.c){selC=e.target.dataset.c;sync()}};
$('#govs').onclick=e=>{const b=e.target.closest('.gv');if(b){selG=b.dataset.g;sync()}};sync();
/* ---------- mapa ---------- */
function fld(c){const gw=Math.ceil(W/c)+2,gh=Math.ceil(H/c)+2,g=Array.from({length:gw*gh},Math.random),s=t=>t*t*(3-2*t);return(x,y)=>{const fx=x/c,fy=y/c,ix=fx|0,iy=fy|0,u=s(fx-ix),v=s(fy-iy),a=g[iy*gw+ix],b=g[iy*gw+ix+1],d=g[(iy+1)*gw+ix],e=g[(iy+1)*gw+ix+1];return(a+(b-a)*u)*(1-v)+(d+(e-d)*u)*v}}
function gen(){const f1=fld(60),f2=fld(22);land=new Uint8Array(N);let n=0;for(let i=0;i<N;i++){const x=i%W,y=i/W|0,ed=Math.max(Math.abs(x/W-.5),Math.abs(y/H-.5))*2;if(.6*f1(x,y)+.4*f2(x,y)-ed**3*.35>.5){land[i]=1;n++}}return n/N}
function mk(id,name,col,gov,bot){return{id,name,col,rgb:rgb(col),dk:rgb(col).map(v=>v*.68),l:rgb(col).map(v=>v+6),gov,bot,pop:60,gold:60,hap:100,sk:{},al:new Set(),rel:{},alive:1,t:0,c:{},food:0,eff:1,war:0}}
function startGame(){let f;do f=gen();while(f<.3||f>.5);landN=land.reduce((a,b)=>a+b,0);COMP=new Int32Array(N);{let nc=0;for(let i=0;i<N;i++)if(land[i]&&!COMP[i]){nc++;const q=[i];COMP[i]=nc;for(let h=0;h<q.length;h++)for(const j of NB[q[h]])if(land[j]&&!COMP[j]){COMP[j]=nc;q.push(j)}}}own=new Uint8Array(N);bld=new Uint8Array(N);A=[];BO=[];T=0;paused=0;tool=0;sel=.5;panel='';
 const HS=NET&&NET.host?NET.hs:[{name:myName(),col:selC,gov:selG}],nb=md=='mp'?8-HS.length:5,cs=COLS.filter(c=>!HS.some(h=>h.col==c)).sort(()=>Math.random()-.5),ns=[...NAMES].sort(()=>Math.random()-.5),gs=Object.keys(GOV);
 P=HS.map((h,i)=>{const p=mk(i+1,h.name,h.col,h.gov,0);if(h.conn){p.conn=h.conn;h.conn.pl=p}return p});for(let i=0;i<nb;i++)P.push(mk(P.length+1,ns[i],cs[i],gs[rnd(3)],1));hum=P[0];
 const st=[];for(let tries=0,md2=80;st.length<P.length;tries++){if(tries%80==79)md2-=3;const i=rnd(N);if(!land[i]||own[i])continue;if(st.some(j=>(j%W-i%W)**2+((j/W|0)-(i/W|0))**2<md2*md2))continue;st.push(i);const p=P[st.length-1],q=[i];let k=0;while(q.length&&k<300){const j=q.shift();if(own[j]||!land[j])continue;so(j,p.id);k++;q.push(...NB[j])}}
 recount();show('game');fit();renderBar();renderPan();toast('Clique num território vizinho para atacar. Escolha % de moradores e construa com ouro.');run=1;if(NET&&NET.host)netInit()}
$('#go').onclick=()=>md=='mp'?hostRoom():startGame();$('#jn').onclick=()=>joinRoom($('#cd').value);$('#ls').onclick=()=>{if(NET&&NET.host){NET.started=1;startGame()}};$('#lq').onclick=()=>{netClose();show('menu')};
function fit(){const w=$('#wrap');S=Math.max(2,Math.floor(Math.min(w.clientWidth/W,w.clientHeight/H)));cv.width=W*S;cv.height=H*S;U=Math.max(2,S);BK.forEach(k=>SC[k]=spr(k,U));if(run)draw()}
addEventListener('resize',fit);
function so(i,o){const f=own[i];if(f){const q=P[f-1];q.t--;if(!q.t&&q.alive){q.alive=0;toastAll(q.name+' foi eliminado!')}}own[i]=o;if(o)P[o-1].t++}
function recount(){for(const p of P){p.t=0;p.sx=p.sy=0;p.c={city:0,wall:0,farm:0,bar:0,mine:0,port:0}}for(let i=0;i<N;i++)if(own[i]){const p=P[own[i]-1];p.t++;p.sx+=i%W;p.sy+=i/W|0;if(bld[i])p.c[BK[bld[i]-1]]++}for(const p of P){p.lx=-1;p.ld=1e9;p.mx=p.sx/(p.t||1);p.my=p.sy/(p.t||1)}for(let i=0;i<N;i++)if(own[i]){const p=P[own[i]-1],d=(i%W-p.mx)**2+((i/W|0)-p.my)**2;if(d<p.ld){p.ld=d;p.lx=i%W;p.ly=i/W|0}}}
const sm=(p,k)=>SK.reduce((s,x)=>s+(p.sk[x[0]]&&x[4]==k?x[5]:0),0);
/* ---------- ações ---------- */
function toast(t){if(TOASTCONN){send(TOASTCONN,{t:'toast',m:t});return}const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3200)}
function build(p,i,k){if(own[i]!=p.id)return p==hum&&toast('Só dá para construir no seu território'),0;if(bld[i])return p==hum&&toast('Já existe uma construção aqui'),0;
 if(k=='port'&&!NB[i].some(j=>!land[j]))return p==hum&&toast('Porto precisa ficar na costa'),0;
 const c=Math.round(B[k][1]*(1+.15*p.c[k]));if(p.gold<c)return p==hum&&toast('Ouro insuficiente ('+c+')'),0;p.gold-=c;bld[i]=BK.indexOf(k)+1;p.c[k]++;return 1}
function buySk(p,id){const x=SK.find(s=>s[0]==id);if(p.sk[id]||(x[3]&&!p.sk[x[3]])||p.gold<x[2])return 0;p.gold-=x[2];p.sk[id]=1;return 1}
function launch(p,x,y,fr){const i=y*W+x;if(x<0||y<0||x>=W||y>=H||!land[i])return 0;const t=own[i];if(t==p.id)return 0;if(t&&p.al.has(t)){p==hum&&toast('Aliados não podem ser atacados. Rompa a aliança antes.');return 0}
 const tr=p.pop*fr;if(tr<5){p==hum&&toast('Poucos moradores para atacar');return 0}if(p==hum){let same=0;for(let k=0;k<N;k++)if(own[k]==p.id&&COMP[k]==COMP[i]){same=1;break}if(!same||!front({o:p.id,t}).length)return boat(p,x,y,t,fr)}const f=p.gov=='dit'?{x,y}:null;let a=A.find(a=>a.o==p.id&&a.t==t);
 if(!a){if(A.filter(a=>a.o==p.id).length>=(p.gov=='dit'?6:4)){p==hum&&toast('Limite de ataques simultâneos');return 0}A.push(a={o:p.id,t,tr:0,f,acc:0,lx:x,ly:y})}
 p.pop-=tr;a.tr+=tr;if(f)a.f=f;return 1}
const bc=b=>b.c!=null?b.c:b.path[Math.min(b.path.length-1,b.k|0)];
function boat(p,x,y,t,fr){
 if(!p.c.port){toast('Sem fronteira com esse território. Construa um Porto para enviar barcos.');return 0}
 if(BO.filter(b=>b.o==p.id).length>=4){toast('Limite de barcos no mar');return 0}
 const par=new Int32Array(N).fill(-2),q=[];
 for(let i=0;i<N;i++)if(bld[i]==6&&own[i]==p.id)for(const j of NB[i])if(!land[j]&&par[j]==-2){par[j]=-1;q.push(j)}
 for(let h=0;h<q.length;h++){const i=q[h];for(const j of NB[i])if(!land[j]&&par[j]==-2){par[j]=i;q.push(j)}}
 let best=-1,bd=1e9;
 for(const i of q)for(const j of NB[i])if(land[j]&&own[j]==t){const d=(j%W-x)**2+((j/W|0)-y)**2;if(d<bd){bd=d;best=i}}
 if(best<0){toast('Nenhuma rota marítima até lá');return 0}
 const path=[];for(let i=best;i!=-1;i=par[i])path.push(i);path.reverse();
 const tr=p.pop*fr;p.pop-=tr;BO.push({o:p.id,t,tr,path,k:0});toast('Barco enviado!');return 1}
function landBoat(b){const p=P[b.o-1],d=b.t?P[b.t-1]:null;
 if(!p.alive||(d&&(!d.alive||p.al.has(d.id)))){p.pop+=b.tr;return}
 const w=b.path[b.path.length-1],j=NB[w].find(j=>land[j]&&own[j]==b.t);
 if(j===undefined){p.pop+=b.tr;return}
 const nb=NB[j].filter(m=>land[m]&&own[m]==b.t);so(j,b.o);for(const m of nb)so(m,b.o);

 if(a)a.tr+=b.tr;else A.push({o:b.o,t:b.t,tr:b.tr,f:{x:j%W,y:j/W|0},acc:0,lx:j%W,ly:j/W|0});

function front(a){const r=[],seen=new Uint8Array(N);a.cn=seen;a.sx=a.sy=a.sn=0;
 for(let i=0;i<N;i++)if(own[i]==a.o){a.sx+=i%W;a.sy+=i/W|0;a.sn++;const nb=NB[i];for(let k=0;k<nb.length;k++){const j=nb[k];if(land[j]&&own[j]==a.t&&!seen[j]++)r.push(j)}}
