  const to=setTimeout(()=>{if(!ok&&NET==n){smsg('Não consegui conectar à sala.');netClose()}},12000);

  c.on('data',clientData);
  c.on('close',()=>{if(NET!=n)return;if(run)lost('A conexão com o anfitrião caiu.');else if($('#end').hidden){smsg('Desconectado da sala.');show('setup');netClose()}else netClose()});
  c.on('error',()=>{if(NET==n&&run)lost('Falha na conexão com o anfitrião.')})})}
function clientData(d){if(!NET||!d)return;
 if(d.t=='no'){smsg(d.m);netClose()}
 else if(d.t=='ll'){if($('#lobby').hidden)lobbyShow();lobbyList(d.l,d.mx,d.bt,d.df)}
 else if(d.t=='i')startClient(d)
 else if(d.t=='s')applySnap(d)
 else if(d.t=='toast')toast(String(d.m).replace(/[<>&]/g,''))
 else if(d.t=='e')fin(d.w,String(d.m).replace(/[<>&]/g,''))}
function startClient(d){md='mp';land=new Uint8Array(N);unrle(d.land,(i,v)=>land[i]=v);landN=d.landN;own=new Uint8Array(N);bld=new Uint8Array(N);A=[];BO=[];T=0;paused=0;tool=0;sel=.5;panel='';
 P=d.pl.map(q=>mk(q.id,cl(q.name),COLS.includes(q.col)?q.col:'#888888',GOV[q.gov]?q.gov:'dem',q.bot));
 for(const p of P){p.c={city:0,wall:0,farm:0,bar:0,mine:0,port:0};p.lx=-1}
 hum=P[d.me-1];NET.last=Date.now();smsg('');show('game');fit();renderBar();renderPan();run=1;toast('Multiplayer: conquiste 95% do mundo para vencer. Clique num território para atacar e construa com ouro.')}
function applySnap(d){if(!run||!P)return;NET.last=Date.now();unrle(d.m,(i,v)=>{own[i]=v/7|0;bld[i]=v%7});
 d.p.forEach((q,i)=>{const p=P[i];if(p)Object.assign(p,q,{al:new Set(q.al)})});
 A=d.a.map(a=>({o:a[0],t:a[1],tr:a[2],lx:a[3],ly:a[4],nv:a[5]}));BO=d.b.map(b=>({o:b[0],t:b[1],tr:b[2],c:b[3]}));
 if(!NET.cen&&hum.lx>=0){NET.cen=1;const sc=$('#sc');sc.scrollLeft=hum.lx*S-sc.clientWidth/2;sc.scrollTop=hum.ly*S-sc.clientHeight/2}
 draw();hudr();NET.n=(NET.n|0)+1;if(panel&&NET.n%6==0)renderPan();const k=JSON.stringify(hum.c);if(k!=NET.k){NET.k=k;renderBar()}}
if(menuOn&&!raf)loop();
</script></body></html>
